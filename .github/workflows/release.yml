name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.asset }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - { os: windows-latest, target: x86_64-pc-windows-msvc, asset: setu-windows-x64.exe, bin: setu.exe }
          - { os: windows-latest, target: aarch64-pc-windows-msvc, asset: setu-windows-arm64.exe, bin: setu.exe }
          - { os: macos-latest, target: aarch64-apple-darwin, asset: setu-macos-arm64, bin: setu }
          - { os: macos-latest, target: x86_64-apple-darwin, asset: setu-macos-x64, bin: setu }
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu, asset: setu-linux-x64, bin: setu }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, asset: setu-linux-arm64, bin: setu }
    steps:
      - uses: actions/checkout@v7
      - name: Tag matches the crate version
        shell: bash
        run: |
          v=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          test "v$v" = "$GITHUB_REF_NAME" || { echo "Tag $GITHUB_REF_NAME does not match version $v"; exit 1; }
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.96.0"
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Name the asset
        shell: bash
        run: |
          mkdir dist
          cp target/${{ matrix.target }}/release/${{ matrix.bin }} dist/${{ matrix.asset }}
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}

  release:
    name: Publish
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: dist/*
          generate_release_notes: true
